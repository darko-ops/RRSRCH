services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rrsrch
      POSTGRES_PASSWORD: rrsrch
      POSTGRES_DB: rrsrch
    ports:
      - "5432:5432"
    volumes:
      - rrsrch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrsrch"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RRSRCH_STORE: postgres
      RRSRCH_DATABASE_URL: postgresql+asyncpg://rrsrch:rrsrch@db:5432/rrsrch
      RRSRCH_EMBEDDER: local
    command: sh -c "alembic upgrade head && rrsrch-api"
    ports:
      - "8000:8000"

volumes:
  rrsrch_pgdata:
