services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rrsrch
      POSTGRES_PASSWORD: rrsrch
      POSTGRES_DB: rrsrch
    ports:
      - "5432:5432"
    volumes:
      - rrsrch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrsrch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rrsrch_pgdata:
