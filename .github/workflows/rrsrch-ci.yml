name: rrsrch CI

# Gates the rrsrch engine on its two offline checks: the unit suite (93 tests —
# confidence, corroboration, bandit, intent guard, flywheel harness) and the
# matching eval (paraphrase hit rate, ~0 scope false-hits, 0 intent false-hits,
# warm < 10% of cold). `make eval` exits non-zero if they fail, so a regression
# fails the build. Postgres/MiniLM variants run on the deployment box
# (make test-pg / make flywheel), not here.

on:
  push:
    paths:
      - "rrsrch/**"
      - ".github/workflows/rrsrch-ci.yml"
  pull_request:
    paths:
      - "rrsrch/**"
      - ".github/workflows/rrsrch-ci.yml"

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rrsrch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install offline deps
        # `make test` and `make eval` run fully offline (in-memory store +
        # deterministic hash embedder; MiniLM integration tests skip themselves
        # when sentence-transformers is absent), so CI installs only this
        # subset — not the heavy Postgres / Torch / MCP stack, which runs on
        # the deployment box (see rrsrch/DECISIONS.md). fastapi + httpx are the
        # light ASGI test surface the dashboard suite needs (create_app + client).
        # Fast and hermetic.
        run: pip install pytest pytest-asyncio numpy "pydantic>=2.7" pydantic-settings tiktoken fastapi httpx

      - name: Unit tests (make test)
        run: make test

      - name: Matching eval — exit criteria (make eval)
        run: make eval
