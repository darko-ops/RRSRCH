name: rrsrch CI

# Gates the rrsrch Phase 0 corpus on its two checks: the unit suite and the
# matching eval (whose exit criteria — paraphrase hit rate, ~0 scope false-hits,
# warm < 10% of cold — are the real bar). `make eval` exits non-zero if they fail,
# so a regression fails the build.

on:
  push:
    paths:
      - "rrsrch/**"
      - ".github/workflows/rrsrch-ci.yml"
  pull_request:
    paths:
      - "rrsrch/**"
      - ".github/workflows/rrsrch-ci.yml"

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rrsrch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install offline deps
        # Phase-0 `make test` and `make eval` run fully offline (in-memory store +
        # deterministic hash embedder), so CI installs only that subset — not the
        # heavy Postgres / Torch / MCP stack, which runs on the deployment box
        # (see rrsrch/DECISIONS.md). Keeps CI fast and hermetic.
        run: pip install pytest numpy "pydantic>=2.7" pydantic-settings tiktoken

      - name: Unit tests (make test)
        run: make test

      - name: Matching eval — exit criteria (make eval)
        run: make eval
