name: backpack

# Scoped to the RRSRCH tool only — never runs for the news site.
on:
  push:
    paths:
      - 'backpack/**'
      - '.github/workflows/backpack.yml'
  pull_request:
    paths:
      - 'backpack/**'
      - '.github/workflows/backpack.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backpack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backpack/package-lock.json
      # The engine/eval are dependency-free, but the MCP server + its smoke test
      # need @modelcontextprotocol/sdk + zod, so install from the lockfile first.
      - run: npm ci
      # npm test = lint:lib + always-cap + eval + the unit/MCP test suite.
      - run: npm test
